<!doctype html>
<html lang="en" data-theme="ink">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Keshav Sharma — Software Engineer building AI systems that reach production: agent orchestration, retrieval pipelines, and the full-stack products around them.">
    <meta name="theme-color" content="#f4f1ea">
    <title>Keshav Sharma — Software Engineer</title>

    <meta property="og:type" content="website">
    <meta property="og:title" content="Keshav Sharma — Software Engineer">
    <meta property="og:description" content="AI systems, agent orchestration and full-stack products. Selected work, record and contact.">
    <meta name="twitter:card" content="summary">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Resolve the theme before first paint so a dark-mode visitor never sees
         a flash of the paper theme. Mirrors src/hooks/useTheme.js. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('kv-theme');
          var themes = ['ink', 'void', 'blueprint', 'riso'];
          var legacy = { cyber: 'void', aurora: 'void', solaris: 'ink' };
          var theme = themes.indexOf(stored) !== -1
            ? stored
            : legacy[stored] || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'void' : 'ink');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) { /* private mode — the default attribute stands */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
